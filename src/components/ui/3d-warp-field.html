<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Warp Field — Hyperspace & Streaks</title>
  <script src="/inner-green-assets/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #02040a; }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }

    /* UI Controls overlay */
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 9999px;
      background: rgba(10, 15, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .variant-btn {
      background: transparent;
      border: none;
      outline: none;
      color: rgba(255, 255, 255, 0.6);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .variant-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .variant-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
    }
    .badge {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 50;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }
    .badge b { color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="badge">WARP FIELD // <b id="variant-label">HYPERSPACE</b></div>

  <div id="canvas-container">
    <canvas id="gl-canvas"></canvas>
  </div>

  <div class="controls">
    <button class="variant-btn" data-variant="hyperspace">Hyperspace</button>
    <button class="variant-btn" data-variant="streaks">Streaks</button>
    <button class="variant-btn" data-variant="letters">Letters</button>
    <button class="variant-btn" data-variant="keycaps">Keycaps</button>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('gl-canvas');
      const params = new URLSearchParams(window.location.search);
      let currentVariant = params.get('variant') || 'hyperspace';

      const VARIANTS = ['streaks', 'letters', 'keycaps', 'hyperspace'];
      const DEFAULTS = {
        speed: 15,
        streakOpacity: 0.6,
        tileOpacity: 0.9,
        fov: 75,
        brightness: 1,
        hue: 0,
        saturation: 1
      };

      const Z_LIMIT = 200;
      const Z_RESET = -1800;
      const CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

      const SPEED_SCALE = { streaks: 1, letters: 0.5, keycaps: 0.7, hyperspace: 2.4 };
      const BG_COLORS = { streaks: 0x02040a, letters: 0x02040a, keycaps: 0x03070c, hyperspace: 0x01020a };

      const CONFIGS = {
        streaks: {
          count: 400,
          radiusMin: 20,
          radiusSpread: 800,
          lengthMin: 50,
          lengthSpread: 150,
          palette: [0x10b981, 0x059669, 0x34d399, 0xffffff],
          opacityScale: 1
        },
        letters: {
          count: 260,
          radiusMin: 20,
          radiusSpread: 800,
          lengthMin: 40,
          lengthSpread: 120,
          palette: [0x38bdf8, 0x0284c7, 0x93c5fd, 0xffffff],
          opacityScale: 1
        },
        keycaps: {
          count: 220,
          radiusMin: 20,
          radiusSpread: 800,
          lengthMin: 40,
          lengthSpread: 140,
          palette: [0x818cf8, 0x6366f1, 0xa78bfa, 0xffffff],
          opacityScale: 1
        },
        hyperspace: {
          count: 1200,
          radiusMin: 6,
          radiusSpread: 760,
          lengthMin: 170,
          lengthSpread: 420,
          palette: [0xffffff, 0xdbeafe, 0x93c5fd, 0x60a5fa, 0xc7d2fe],
          opacityScale: 1.45
        }
      };

      // Scene, Camera, Renderer
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(BG_COLORS[currentVariant]);
      scene.fog = new THREE.FogExp2(BG_COLORS[currentVariant], 0.001);

      const camera = new THREE.PerspectiveCamera(DEFAULTS.fov, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.z = 0;

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const warpGroup = new THREE.Group();
      scene.add(warpGroup);

      // --- Streaks system ---
      function createStreaks(parent, config, streakOpacity) {
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(config.count * 6);
        const colors = new Float32Array(config.count * 6);
        const palette = config.palette.map(c => new THREE.Color(c));

        for (let i = 0; i < config.count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.random() * config.radiusSpread + config.radiusMin;
          const x = Math.cos(angle) * r;
          const y = Math.sin(angle) * r;
          const z = (Math.random() - 0.5) * 2000;
          const len = Math.random() * config.lengthSpread + config.lengthMin;

          positions[i * 6] = x;
          positions[i * 6 + 1] = y;
          positions[i * 6 + 2] = z;
          positions[i * 6 + 3] = x;
          positions[i * 6 + 4] = y;
          positions[i * 6 + 5] = z + len;

          const col = palette[Math.floor(Math.random() * palette.length)];
          colors[i * 6] = col.r; colors[i * 6 + 1] = col.g; colors[i * 6 + 2] = col.b;
          colors[i * 6 + 3] = col.r; colors[i * 6 + 4] = col.g; colors[i * 6 + 5] = col.b;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.LineBasicMaterial({
          vertexColors: true,
          transparent: true,
          opacity: streakOpacity * config.opacityScale,
          blending: THREE.AdditiveBlending
        });

        const lines = new THREE.LineSegments(geo, mat);
        parent.add(lines);

        const posAttr = geo.attributes.position;
        return {
          update(speed) {
            for (let i = 0; i < config.count; i++) {
              positions[i * 6 + 2] += speed;
              positions[i * 6 + 5] += speed;
              if (positions[i * 6 + 2] > Z_LIMIT) {
                const len = positions[i * 6 + 5] - positions[i * 6 + 2];
                positions[i * 6 + 2] = Z_RESET;
                positions[i * 6 + 5] = Z_RESET + len;
              }
            }
            posAttr.needsUpdate = true;
          },
          dispose() {
            geo.dispose();
            mat.dispose();
            parent.remove(lines);
          }
        };
      }

      // --- Hyperspace tunnel & glow ---
      function createHyperspaceTunnel(parent, opacity) {
        const cvs = document.createElement('canvas');
        cvs.width = 512; cvs.height = 512;
        const ctx = cvs.getContext('2d');
        if (ctx) {
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, 512, 512);
          for (let i = 0; i < 240; i++) {
            const x = Math.random() * 512;
            const w = Math.random() * 3 + 0.6;
            const h = Math.random() * 320 + 90;
            const y = Math.random() * 512;
            const alpha = (Math.random() * 0.45 + 0.08).toFixed(3);
            for (const off of [-512, 0, 512]) {
              const grad = ctx.createLinearGradient(0, y + off, 0, y + off + h);
              grad.addColorStop(0, 'rgba(191,219,254,0)');
              grad.addColorStop(0.5, `rgba(224,238,255,${alpha})`);
              grad.addColorStop(1, 'rgba(147,197,253,0)');
              ctx.fillStyle = grad;
              ctx.fillRect(x, y + off, w, h);
            }
          }
        }
        const tunnelTex = new THREE.CanvasTexture(cvs);
        tunnelTex.wrapS = THREE.RepeatWrapping;
        tunnelTex.wrapT = THREE.RepeatWrapping;
        tunnelTex.repeat.set(4, 2);

        const cylinderGeo = new THREE.CylinderGeometry(900, 240, 3000, 64, 1, true);
        cylinderGeo.rotateX(Math.PI / 2);

        const cylinderMat = new THREE.MeshBasicMaterial({
          map: tunnelTex,
          side: THREE.BackSide,
          transparent: true,
          opacity: opacity * 0.6,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });

        const cylinder = new THREE.Mesh(cylinderGeo, cylinderMat);
        cylinder.position.z = -1400;
        parent.add(cylinder);

        // Core central star glow
        const glowCvs = document.createElement('canvas');
        glowCvs.width = 256; glowCvs.height = 256;
        const gctx = glowCvs.getContext('2d');
        if (gctx) {
          const rad = gctx.createRadialGradient(128, 128, 0, 128, 128, 128);
          rad.addColorStop(0, 'rgba(255,255,255,1)');
          rad.addColorStop(0.18, 'rgba(219,234,254,0.55)');
          rad.addColorStop(0.45, 'rgba(96,165,250,0.16)');
          rad.addColorStop(1, 'rgba(2,6,23,0)');
          gctx.fillStyle = rad;
          gctx.fillRect(0, 0, 256, 256);
        }
        const glowTex = new THREE.CanvasTexture(glowCvs);
        const spriteMat = new THREE.SpriteMaterial({
          map: glowTex,
          transparent: true,
          opacity: opacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.position.z = -900;
        sprite.scale.set(760, 760, 1);
        parent.add(sprite);

        return {
          update(speed, time) {
            tunnelTex.offset.y -= speed * 0.0016;
            cylinder.rotation.z += 0.0016;
            const pulse = 1 + Math.sin(time * 1.6) * 0.06;
            sprite.scale.set(760 * pulse, 760 * pulse, 1);
          },
          dispose() {
            cylinderGeo.dispose();
            cylinderMat.dispose();
            tunnelTex.dispose();
            spriteMat.dispose();
            glowTex.dispose();
            parent.remove(cylinder, sprite);
          }
        };
      }

      // --- Letters texture and tiles ---
      function createLetterTiles(parent, opacity) {
        const cvs = document.createElement("canvas");
        cvs.width = 768; cvs.height = 768;
        const ctx = cvs.getContext("2d");
        if (ctx) {
          ctx.fillStyle = "#ffffff";
          ctx.font = '700 86px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          CHARS.split("").forEach((c, idx) => {
            const col = idx % 6, row = Math.floor(idx / 6);
            ctx.fillText(c, col * 128 + 64, row * 128 + 69);
          });
        }
        const charTex = new THREE.CanvasTexture(cvs);
        charTex.minFilter = THREE.LinearFilter;

        const geometries = CHARS.split("").map((c, idx) => {
          const geo = new THREE.PlaneGeometry(1, 1);
          const col = idx % 6, row = Math.floor(idx / 6);
          const u = col / 6, v = 1 - (row + 1) / 6;
          const uvAttr = geo.attributes.uv;
          for (let k = 0; k < uvAttr.count; k++) {
            uvAttr.setXY(k, u + uvAttr.getX(k) / 6, v + uvAttr.getY(k) / 6);
          }
          uvAttr.needsUpdate = true;
          return geo;
        });

        const materials = [0xffffff, 0x38bdf8, 0x0284c7].map(color => new THREE.MeshBasicMaterial({
          map: charTex,
          color: color,
          transparent: true,
          opacity: opacity,
          depthWrite: false,
          side: THREE.DoubleSide
        }));

        const items = [];
        for (let i = 0; i < 260; i++) {
          const geo = geometries[Math.floor(Math.random() * geometries.length)];
          const mat = materials[Math.floor(Math.random() * materials.length)];
          const mesh = new THREE.Mesh(geo, mat);
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * 430 + 60;
          mesh.position.set(Math.cos(angle) * dist, Math.sin(angle) * dist, -1300 + Math.random() * 1440);
          const scale = Math.random() * 30 + 24;
          mesh.scale.set(scale, scale, scale);
          parent.add(mesh);
          items.push({
            mesh,
            spin: (Math.random() - 0.5) * 0.02,
            swayX: Math.random() * 0.5 + 0.2,
            swayY: Math.random() * 0.6 + 0.2,
            phase: Math.random() * Math.PI * 2,
            drift: Math.random() * 0.9 + 0.2
          });
        }

        return {
          update(speed, time) {
            items.forEach(d => {
              d.mesh.position.z += speed;
              const s = time * d.drift + d.phase;
              d.mesh.position.x += Math.cos(s) * d.drift * 0.9;
              d.mesh.position.y += Math.sin(s * 0.8) * d.drift * 0.9;
              d.mesh.rotation.z += d.spin;
              d.mesh.rotation.x = Math.sin(s * 0.6) * d.swayX;
              d.mesh.rotation.y = Math.cos(s * 0.5) * d.swayY;
              if (d.mesh.position.z > 140) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 430 + 60;
                d.mesh.position.set(Math.cos(angle) * dist, Math.sin(angle) * dist, -1300);
              }
            });
          },
          dispose() {
            geometries.forEach(g => g.dispose());
            materials.forEach(m => m.dispose());
            charTex.dispose();
            items.forEach(d => parent.remove(d.mesh));
          }
        };
      }

      // Active modules holder
      let activeModules = [];

      function loadVariant(v) {
        currentVariant = v;
        document.getElementById('variant-label').textContent = v.toUpperCase();
        document.querySelectorAll('.variant-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.variant === v);
        });

        // Clear existing
        activeModules.forEach(m => m.dispose?.());
        activeModules = [];

        // Set background & fog
        scene.background.setHex(BG_COLORS[v] || 0x02040a);
        scene.fog.color.setHex(BG_COLORS[v] || 0x02040a);

        // Always add base streaks
        const streaks = createStreaks(warpGroup, CONFIGS[v] || CONFIGS.hyperspace, DEFAULTS.streakOpacity);
        activeModules.push(streaks);

        if (v === 'hyperspace') {
          activeModules.push(createHyperspaceTunnel(warpGroup, DEFAULTS.tileOpacity));
        } else if (v === 'letters' || v === 'keycaps') {
          activeModules.push(createLetterTiles(warpGroup, DEFAULTS.tileOpacity));
        }
      }

      // Initial load
      loadVariant(currentVariant);

      // UI Listeners
      document.querySelectorAll('.variant-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          loadVariant(btn.dataset.variant);
        });
      });

      // Resize
      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onResize);

      // Animation Loop
      let clock = 0;
      function animate() {
        requestAnimationFrame(animate);
        clock += 1 / 60;
        const speed = DEFAULTS.speed * (SPEED_SCALE[currentVariant] || 1);
        activeModules.forEach(m => m.update?.(speed, clock));
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
