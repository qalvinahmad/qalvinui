<script>
/* The loader (#kindle) draws its fire in a worker. A worker can start, and
   make its WebGL context, only while this thread is free: it is now, while
   the stylesheets below come in, and not again until the whole page is
   parsed. So it is started here, on a canvas #kindle takes over. */
window.__kbBoot = 'self.window = self; self.onmessage = e => { const d = e.data || {};'
  + ' if (d.kbPre){ self.__kbCanvas = d.canvas; try { d.canvas.getContext("webgl", {antialias:false, alpha:false, depth:false, stencil:false}); } catch (x) {} return; }'
  + ' if (!d.kbInit) return; self.onmessage = null; d.canvas = d.canvas || self.__kbCanvas; self.__kbInit = d; (0, eval)(d.src); };';
(() => {
  try {
    if (window.__kbNoWorker || typeof Worker !== 'function' || typeof OffscreenCanvas !== 'function') return;
    const canvas = document.createElement('canvas');
    if (!canvas.transferControlToOffscreen) return;
    const url = URL.createObjectURL(new Blob([window.__kbBoot], {type:'text/javascript'}));
    const worker = new Worker(url), pre = window.__kbPre = {worker, canvas, url, failed:false};
    worker.onerror = e => { e.preventDefault(); pre.failed = true; };
    const off = canvas.transferControlToOffscreen();
    worker.postMessage({kbPre:1, canvas:off}, [off]);
  } catch (e) { window.__kbPre = null; }
})();
</script>

<style>
  :root{
    --ink:#f2ece2;
    --dim:rgba(242,236,226,.62);
    --hair:rgba(242,236,226,.16);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
    --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-weight:normal}
  html,body{height:100%}
  html{scrollbar-width:none}
  html::-webkit-scrollbar{display:none}
  body{
    background:#0a0806;color:var(--ink);font-family:var(--sans);
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  /* The whole piece is scroll-linked. This height is shared out by SPAN in
     the script — eight dwells of 1.15, seven moves of 0.85 and the sheet's
     1.35 — so one unit is about one screen: a screen of scrolling spent inside
     a scene with its craft advancing, then most of a screen to burn across. */
  #track{height:1742vh}
  #stage{position:fixed;inset:0;overflow:hidden;background:#0a0806}
  canvas#gl{position:absolute;inset:0;display:block}

  /* the loader is black like the intro's first frame, not the warm page black,
     so the two can hand over without a shift in the dark */
  #kindle{position:fixed;inset:0;z-index:8;background:#000;pointer-events:none;
    transition:opacity .16s linear}
  /* the count lands on 100, holds a beat, and goes before the ring can
     reach it; on the compositor, so a busy first frame cannot cut it short */
  #kindle .kindle-label{transition:opacity .40s linear .12s}
  #kindle.lit .kindle-label{opacity:0}
  #kindle.out{opacity:0}
  #kindle canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .kindle-label{position:absolute;left:50%;top:calc(50% + 24vh);transform:translateX(-50%);
    display:flex;align-items:baseline;gap:14px;white-space:nowrap;
    font:normal 11px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;
    color:rgba(242,236,226,.52)}
  .kindle-label b{font-weight:normal;min-width:3ch;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;color:rgba(242,236,226,.78)}
  @media (prefers-reduced-motion:reduce){ #kindle{transition-duration:.25s} }

  .chrome{position:fixed;inset:0;pointer-events:none;z-index:5}
  /* the index and the volume line sit on whatever floor the station has;
     a low shade under them keeps them legible on the pale benches */
  .chrome::before{content:"";position:absolute;left:0;right:0;bottom:0;height:190px;
    pointer-events:none;background:linear-gradient(to top,rgba(9,7,5,.50),rgba(9,7,5,.18) 55%,rgba(9,7,5,0))}
  .chrome a,.chrome button{pointer-events:auto}
  .prop-cue{position:fixed;left:0;top:0;z-index:6;display:flex;align-items:center;gap:9px;
    padding:7px 10px;border:1px solid rgba(224,189,128,.52);background:rgba(27,19,12,.83);
    box-shadow:0 5px 18px rgba(0,0,0,.28);color:#f3dfbd;font:normal 11px/1 var(--sans);
    letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;pointer-events:none;
    opacity:0;transform:translate(-100px,-100px);transition:opacity .16s ease}
  .prop-cue.is-visible{opacity:1}
  .prop-cue::before{content:'';width:5px;height:5px;flex:none;border:1px solid #dbad64;
    border-radius:50%;box-shadow:0 0 8px rgba(230,171,85,.7)}

  /* ---- inspect: an item lifted out of the workshop and turned in the hand.
     The words step back with a filter, not opacity, because the script
     already writes opacity on every one of them each frame. ---- */
  .chrome .chapter,.chrome .chap-scrim,.chrome .lockup,.chrome .index,.chrome .vol,.chrome .cue,.chrome .bar{transition:filter .5s ease,visibility 0s}
  /* Stop rasterizing the lettering after its existing fade reaches zero. */
  /* the scrim behind the words stays: without it the room behind them came
     up brighter than it was, before the dim had arrived (and after). The
     words are gone in 60ms: a tenth of the title still lay over the lifted
     plane at 150 */
  .chrome.inspecting .chapter,.chrome.inspecting .lockup,.chrome.inspecting .cue{
    filter:opacity(0) blur(3px);visibility:hidden!important;transition:filter .06s linear,visibility 0s .06s}
  .chrome.inspecting .index,.chrome.inspecting .vol{filter:opacity(.04) blur(3px)}
  /* the bar stays live while an item is out: its words step back, and the
     Commission pill a little with them, by its opacity (to 80%, full again
     under the hand) — at full cream it was the brightest thing on screen;
     at 60% it went a flat grey and read as disabled */
  .chrome .bar :is(.brand,.nav,.issue){transition:filter .5s ease,opacity .2s ease}
  .chrome.inspecting .bar :is(.brand,.nav,.issue){filter:opacity(.55)}
  .chrome .bar .pill{transition:opacity .5s ease,background .2s ease}
  .chrome.inspecting .bar .pill:not(:hover,:focus-visible){opacity:.8}
  .inspect{position:fixed;left:50%;bottom:clamp(24px,4.6vh,48px);z-index:7;
    display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;
    pointer-events:none;opacity:0;transform:translate(-50%,14px);
    transition:opacity .35s ease,transform .6s cubic-bezier(.2,.75,.2,1)}
  .inspect.on{opacity:1;transform:translate(-50%,0);transition-delay:.18s}
  .inspect .t{font:normal clamp(26px,2.5vw,40px)/1 var(--serif);color:var(--ink);letter-spacing:.005em}
  .inspect .t i{font-style:normal;font-family:var(--mincho);font-size:.52em;margin-left:.55em;
    color:rgba(242,236,226,.78);vertical-align:.18em}
  /* the note a step up and a little brighter: at 16px and 62% the one line
     under the name read as small, faint italic */
  .inspect .n{font:italic normal clamp(16px,1.25vw,20px)/1.3 var(--serif);color:rgba(242,236,226,.76);text-wrap:balance}
  .inspect .h{display:flex;align-items:center;gap:14px;margin-top:6px;
    font:normal 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:rgba(242,236,226,.5)}
  .inspect .h s{width:22px;height:1px;background:var(--hair);text-decoration:none}
  .inspect .h > *{white-space:nowrap}
  @media (hover:none){ .inspect .x span{display:none} }
  .inspect .x{pointer-events:auto;cursor:pointer;background:none;border:0;padding:6px 0;
    font:inherit;letter-spacing:inherit;text-transform:inherit;color:rgba(242,236,226,.78)}
  .inspect .x:hover,.inspect .x:focus-visible{color:var(--ink);outline:none}

  /* ---------------- top bar ---------------- */
  .bar{
    position:absolute;left:0;right:0;top:0;height:60px;z-index:2;   /* over the sheet */
    display:flex;align-items:center;gap:30px;padding:0 30px;opacity:0;
  }
  /* the workshop is lit through shoji, and three of the stations put a
     bright window right under the nav — a short shade keeps it readable
     without reading as a band */
  .bar::before{content:"";position:absolute;left:0;right:0;top:0;height:132px;z-index:-1;
    pointer-events:none;background:linear-gradient(rgba(9,7,5,.66),rgba(9,7,5,.30) 48%,rgba(9,7,5,0))}
  .bar a{color:inherit;text-decoration:none}
  .bar .brand{font-weight:normal;font-size:18px;letter-spacing:.01em}
  .bar .nav a,.bar .brand{transition:opacity .2s ease}
  .bar .nav a:hover{opacity:.62}
  .bar a:focus-visible,.index a:focus-visible{outline:1px solid var(--ink);outline-offset:5px}
  .bar .brand i{
    font-style:normal;font-family:var(--mincho);font-weight:normal;
    font-size:15px;margin-left:10px;opacity:.72;letter-spacing:.06em;
  }
  .bar .nav{display:flex;gap:26px;font-size:14px;font-weight:normal;opacity:.75}
  .bar .right{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:13px;font-weight:normal}
  .bar .issue{opacity:.75}
  .bar .pill{
    background:#f2ece2;border:0;border-radius:2px;color:#100c08;
    box-shadow:inset 0 0 0 1px rgba(242,236,226,.7);
    padding:9px 17px 10px;font:normal 12.5px/1 var(--sans);letter-spacing:.02em;cursor:pointer;
    transition:background .2s ease;
  }
  .bar .pill:hover{background:#fffaf1}

  /* ---------------- chapter titles ---------------- */
  .chapter{
    position:absolute;left:0;right:0;top:0;bottom:0;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 clamp(30px,5.5vw,110px);opacity:0;visibility:hidden;
  }
  .chapter.right{align-items:flex-end;text-align:right}
  /* on the right-hand chapters the kanji goes to the outer edge: on the inner
     side it was stamped on the work (the board, the boards, the bowl) */
  .chapter.right .big{flex-direction:row-reverse}
  /* a scrim on the type side only — the lattice is bright and the titles are
     white, and nothing else keeps them readable without shrinking them */
  /* It is its own layer, under all the words, not the chapter's ::before:
     inside the chapter it was clipped by the title's straight mask and
     arrived as a hard-edged dark panel a hand behind the ragged flame. */
  /* and a soft pool of shade round the title band itself: where a lit
     shoji sits behind the title the side gradient alone left cream on
     pale paper, and deepening all of it would dim the work as well */
  .chap-scrim{
    position:absolute;inset:0;pointer-events:none;visibility:hidden;
    background:radial-gradient(38% 24% at 30% 35%,rgba(10,8,6,.62),rgba(10,8,6,.40) 45%,rgba(10,8,6,0)),
               linear-gradient(90deg,rgba(10,8,6,.80) 0%,rgba(10,8,6,.60) 28%,
               rgba(10,8,6,.20) 52%,rgba(10,8,6,0) 70%);
  }
  .chap-scrim.right{
    background:radial-gradient(38% 24% at 70% 35%,rgba(10,8,6,.62),rgba(10,8,6,.40) 45%,rgba(10,8,6,0)),
               linear-gradient(270deg,rgba(10,8,6,.80) 0%,rgba(10,8,6,.60) 28%,
               rgba(10,8,6,.20) 52%,rgba(10,8,6,0) 70%);
  }
  .chapter > *{position:relative}
  .num{
    display:flex;align-items:center;gap:14px;
    font-size:14px;font-weight:normal;letter-spacing:.26em;text-transform:uppercase;
    color:var(--dim);margin-bottom:clamp(10px,1.2vw,22px);
    /* small light type that can land on a lit shoji: a soft dark halo keeps
       it legible (one element, not split, so it costs nothing per frame) */
    text-shadow:0 0 10px rgba(10,8,6,.9),0 0 3px rgba(10,8,6,.85);
  }
  .num s{display:block;width:clamp(34px,4vw,70px);height:1px;background:var(--hair);text-decoration:none}
  .big{
    font-family:var(--serif);font-weight:normal;
    font-size:clamp(82px,16.5vw,322px);line-height:.79;letter-spacing:-.024em;
    display:flex;align-items:baseline;gap:clamp(14px,2vw,38px);flex-wrap:wrap;
  }
  /* The line box is 0.79em, so a descender hangs a fifth of the title below
     it. Seigaiha, Kigumi and Yakisugi put their g straight through the first
     line of the lede; the extra margin is that descender, so the lede sits
     the same distance from the ink on every chapter. */
  .big.desc{margin-bottom:.205em}
  /* nine letters at the house size would run the kanji onto the chest */
  .big.long{font-size:clamp(76px,14.2vw,280px)}
  /* the chest needs the room beside it: its drawers only read at a size */
  @media (min-width:821px){ .big.long.mid{font-size:clamp(70px,12.2vw,240px)} }
  /* where the work fills the other half of the frame, the kanji stand in a
     column beside the word, the way they would be written, and the title
     keeps clear of it */
  @media (min-width:821px){
    .big.stack{flex-wrap:nowrap;align-items:flex-start}
    .big.stack em{writing-mode:vertical-rl;transform:translateY(.02em);letter-spacing:.06em;
      font-size:clamp(28px,4.2vw,82px);line-height:1}
  }
  /* a soft dark halo under the kanji, which are thin and cross lit paper
     and pale timber; the Latin is heavy enough without. It belongs to each
     landed letter (.in), and eases on rather than arriving with the fade. */
  .big em .l{transition:text-shadow .45s ease}
  .big em .l.in{text-shadow:0 0 .07em rgba(10,8,6,.72),0 0 .20em rgba(10,8,6,.52),0 0 .5em rgba(10,8,6,.30)}
  .big em{
    font-family:var(--mincho);font-style:normal;font-weight:normal;
    font-size:clamp(32px,5.8vw,108px);letter-spacing:.10em;opacity:.93;
    line-height:1;transform:translateY(-.12em);
  }
  .lede{
    text-wrap:pretty;
    font-family:var(--serif);font-style:italic;font-weight:normal;
    font-size:clamp(20px,2.35vw,42px);line-height:1.26;
    max-width:min(16.5em,44vw);margin-top:clamp(16px,1.8vw,34px);opacity:.9;
  }
  .meta{
    display:flex;gap:clamp(20px,3vw,56px);margin-top:clamp(18px,2.2vw,40px);
    font-size:13px;font-weight:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  }
  .meta b{display:block;font-weight:normal;font-size:17px;letter-spacing:.01em;
    text-transform:none;color:var(--ink);margin-top:5px}

  /* The copy assembles under the scroll. A title's letters are laid out
     absolutely from measurements taken on the intact run (see splitRun), so
     the run itself stays as the accessible, selectable text and the boxes
     over it inherit its kerning instead of losing it. */
  .w{position:relative;display:inline-block}
  .gh{color:transparent}
  /* line-height:normal is load-bearing: the title's line box is 0.79em, so a
     letter box inheriting it would paint its glyph half the leading *above*
     its own top and the whole title would ride 60px high of the run it was
     measured from. At normal the box is the font's own height and the glyph
     lands exactly where the Range said. */
  .l{position:absolute;white-space:pre;line-height:normal}
  .wd{display:inline-block}

  /* ---------------- the landing lockup ----------------
     The page opens on the house, not on chapter one: the wordmark set large
     over the lattice with its seal, and the one line that says what this
     is. The first turn of the wheel burns it off and Kumiko assembles. */
  .lockup{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;text-align:center;
    opacity:0;visibility:hidden;pointer-events:none;white-space:nowrap;
    /* the box carries its own backdrop, so the burn's mask covers the
       backdrop too — a mask clips everything outside the border box */
    padding:14vh 16vw}
  /* on a desk the house name stands where chapter one's title will be
     branded, in the dark to the left of the panel, not on its lit paper */
  @media (min-width:821px){
    .lockup{left:calc(clamp(30px,5.5vw,110px) - 16vw);transform:translate(0,-50%);
      align-items:flex-start;text-align:left}
  }

    z-index:-1;pointer-events:none;
    background:radial-gradient(closest-side,rgba(10,8,6,.74),rgba(10,8,6,.46) 55%,rgba(10,8,6,0))}
  .lk-mark{display:flex;align-items:center;gap:clamp(14px,1.6vw,28px)}
  .lk-word{font-family:var(--serif);font-size:clamp(58px,10.5vw,196px);line-height:1;
    letter-spacing:.20em;margin-right:-.20em;
    text-shadow:0 0 .12em rgba(10,8,6,.5),0 0 .4em rgba(10,8,6,.3)}
  .lk-v{writing-mode:vertical-rl;font-family:var(--mincho);font-size:clamp(15px,1.55vw,28px);
    letter-spacing:.18em;opacity:.9;align-self:center}
  .lkg{display:inline}
  .lk-seal{display:grid;place-items:center;width:clamp(30px,2.5vw,44px);aspect-ratio:1;
    background:#a3392c;color:#f6ead5;font-family:var(--mincho);font-size:clamp(11px,.86vw,16px);
    line-height:1.02;border-radius:2px;align-self:flex-end;margin-bottom:.4em;
    box-shadow:inset 0 0 0 2px rgba(246,234,213,.18)}
  .lk-line{margin-top:clamp(18px,2.2vw,34px);font-family:var(--serif);font-style:italic;
    font-size:clamp(19px,1.75vw,30px);letter-spacing:.005em;opacity:.92}

  @media (max-width:820px){
    .lockup{top:48%}
    .lk-word{font-size:15.5vw;letter-spacing:.16em;margin-right:-.16em}

  }

  .veil{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;overflow:hidden;
    background:
      radial-gradient(70% 55% at 50% 62%,rgba(90,34,10,.30),rgba(0,0,0,0) 70%),
      radial-gradient(120% 90% at 50% 55%,rgba(20,12,7,.96),rgba(6,4,3,.99) 70%)}
  /* the smoke itself keeps moving while the page jumps under it: two
     sheets rolling up and apart at different speeds, restarted each time */
  .veil::before,.veil::after{content:"";position:absolute;inset:-12%;will-change:transform}
  .veil::before{background:url("https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/kibori/59a3146ba987dac112122ed92595ebea408547ce40972c7d05985e589bae878d.svg") center/cover}
  .veil::after{background:url("https://ublctyddhtbgaersvxxb.supabase.co/storage/v1/object/public/threeui-media/scene-images/kibori/ca98f43d601fb0f2f63da9ce5a0bf62a9a41273ea806a3f047783620c8b33ceb.svg") center/cover;opacity:.55;mix-blend-mode:screen}
  .veil.run::before{animation:veilRoll 1.3s cubic-bezier(.25,.6,.35,1) both}
  .veil.run::after{animation:veilRoll2 1.3s cubic-bezier(.25,.6,.35,1) both}
  @keyframes veilRoll{from{transform:translate3d(-2%,5%,0) scale(1.02) rotate(-1deg)}to{transform:translate3d(2%,-6%,0) scale(1.12) rotate(1.5deg)}}

  /* ---------------- persistent index ---------------- */
  .index{

    .index a{font-size:12px;line-height:15px}

  /* ---------------- the sheet: the footer comes up like paper ------------ */
  #foot{

    filter:drop-shadow(0 -3px 3px rgba(4,3,2,.55)) drop-shadow(0 -10px 14px rgba(4,3,2,.32));
    transform:translate3d(0,100%,0);will-change:transform;

    scrollbar-color:#aa9880 transparent;-webkit-overflow-scrolling:touch}

  /* the sheet lifts off the workshop rather than sitting on it */
  #foot .shade{

<body>
<div id="stage"><canvas id="gl"></canvas></div>

<!-- Kindling: the loader is the first stretch of the intro burn. The same
     ragged rim, from the same noise, opens on black while the page loads, and
     the WebGL intro picks it up at the exact size it reached. -->
<div id="kindle">
  <canvas id="kindle-gl" aria-hidden="true"></canvas>
  <div class="kindle-label" role="progressbar" aria-label="Loading the workshop"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span>Kindling</span><b>0</b></div>
</div>
<script>
(() => {
  /* This same script also runs in a worker (see the end), which is handed
     the canvas and draws the fire there, on frames of its own. */
  const IN_W = typeof document === 'undefined', WI = IN_W ? self.__kbInit : null;
  const SRC = IN_W ? '' : ((document.currentScript || {}).textContent || '');
  const root = IN_W ? null : document.getElementById('kindle');
  let cv = IN_W ? WI.canvas : document.getElementById('kindle-gl');
  const label = IN_W ? null : root.querySelector('.kindle-label'), num = IN_W ? null : label.querySelector('b');
  const reduced = IN_W ? WI.reduced : matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* the intro burn's own progress at the hand-off — the module resumes the
     intro from exactly here (INTRO.hand), so the two rims coincide */
  const HAND = 0.36;
  /* while it waits the rim holds a little short of the hand-off, then runs
     into it at the speed the intro starts with — a ring that stalls and is
     then overtaken by a faster one reads as two fires. That speed is kept
     low (uProg/s): leaving at easeBurn's full pace, the ring grew 180 px a
     frame from a standstill */
  const WAIT = 0.290, V_HAND = 0.24;
  /* and never still: it creeps on at VMIN (about 5 px a frame at 8 fps),
     held to a limit a little ahead of the real progress that itself rises
     at 0.012/s, up to CEIL, which leaves room for a smooth run in (a fixed
     ceiling it reached early stood it still for a second) */
  const VMIN = 0.016, CEIL = 0.335;
  /* nor faster than VMAX: after a stall the progress arrived in one lump,
     and the coal leapt a size in a frame */
  const VMAX = 0.05;
  /* the radius that is seen, in screen heights: the coal's, then the ring's */
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a)/(b - a))); return t*t*(3 - 2*t); };
  /* What is seen, for the clock: the rim's radius in CSS px as the loader FS
     draws it (its Tv: a 4 px fleck at uProg 0, 5.8 px by 0.15, then the burn's
     own T at kbScale — keep in step with the FS), and how bright it is (its
     gain, 0 at uProg 0). The pace is planned in S = gain + ln(radius/first

    const rc = new THREE.Raycaster(), hits = new Set(), v = new THREE.Vector2();
    for (let y = c.top - 8; y <= c.bottom + 8; y += 4) for (let x = c.left - 8; x <= c.right + 8; x += 4){
      rc.setFromCamera(v.set(x/VW*2 - 1, 1 - y/VH*2), camera);
      roots.forEach((r, i) => { if (rc.intersectObject(r, true).some(h => h.object.isMesh && shown(h.object))) hits.add(i < table.entries.length - 1 ? 'prop' : (r.name || 'work')); });
    }
    /* and its own piece: how far the nearest pixel of it is */
    let own = 1e9;
    if (focus) for (let y = c.top - 80; y <= c.bottom + 80; y += 3) for (let x = c.left - 80; x <= c.right + 80; x += 3){
      const dx = Math.max(c.left - x, 0, x - c.right), dy = Math.max(c.top - y, 0, y - c.bottom), dd = Math.hypot(dx, dy);
      if (dd >= own) continue;
      rc.setFromCamera(v.set(x/VW*2 - 1, 1 - y/VH*2), camera);
      if (rc.intersectObject(focus, true).some(h => h.object.isMesh)) own = dd;
    }
    /* and every other piece: how far the nearest pixel of any is (40px round) */
    let near = 1e9;
    for (let y = c.top - 40; y <= c.bottom + 40; y += 3) for (let x = c.left - 40; x <= c.right + 40; x += 3){
      const dx = Math.max(c.left - x, 0, x - c.right), dy = Math.max(c.top - y, 0, y - c.bottom), dd = Math.hypot(dx, dy);
      if (dd >= near) continue;
      rc.setFromCamera(v.set(x/VW*2 - 1, 1 - y/VH*2), camera);
      if (roots.slice(0, table.entries.length - 1 + table.obstacles.filter(o => o.entry && o.entry.object !== focus).length).some(r => rc.intersectObject(r, true).some(h => h.object.isMesh && shown(h.object)))) near = dd;
    }
    /* and the work itself, 40px round */
    let work = 1e9;
    for (let y = c.top - 60; y <= c.bottom + 60; y += 4) for (let x = c.left - 60; x <= c.right + 60; x += 4){
      const dx = Math.max(c.left - x, 0, x - c.right), dy = Math.max(c.top - y, 0, y - c.bottom), dd = Math.hypot(dx, dy);
      if (dd >= work) continue;
      rc.setFromCamera(v.set(x/VW*2 - 1, 1 - y/VH*2), camera);
      if (table.avoid.some(r => rc.intersectObject(r, true).some(h => h.object.isMesh && shown(h.object)))) work = dd;
    }
    let words = 1e9;
    for (const w of propWords({relief:1, joinery:2, planing:7}[table.id])){ const R = w.getBoundingClientRect(); if (!R.width) continue;
      words = Math.min(words, Math.max(R.left - c.right, c.left - R.right, R.top - c.bottom, c.top - R.bottom)); }
    return {cue:[c.left, c.top, c.right, c.bottom].map(Math.round), text:el.textContent, hits:[...hits], words:Math.round(words), work:Math.round(work), own:Math.round(own), near:Math.round(near),
      inside: c.left >= 8 && c.top >= 8 && c.right <= VW - 8 && c.bottom <= VH - 8};
  },
  /* debug: a piece against the others as seen — the rects of their
     projected vertices, and how many 3px rays through both rects meet both */
  propRect(id){
    const T = tabletopPhysics, table = T.tables.get(T.activeTableId); if (!table) return null;
    const e = table.entries.find(x => x.id === id); if (!e) return null;
    const v = new THREE.Vector3(); let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; e.object.updateMatrixWorld(true);
    e.object.traverseVisible(m => { if (!m.isMesh || !m.geometry) return; const P = m.geometry.attributes.position;
      for (let k = 0; k < P.count; k += 3){ v.fromBufferAttribute(P, k).applyMatrix4(m.matrixWorld).project(camera);
        const X = (v.x + 1)/2*VW, Y = (1 - v.y)/2*VH; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); } });
    return [x0, y0, x1, y1];
  },
  propScreen(id){
    const T = tabletopPhysics, table = T.tables.get(T.activeTableId); if (!table) return null;
    const me = table.entries.find(e => e.id === id); if (!me) return null;
    const v = new THREE.Vector3();
    const rectOf = o => { let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; o.updateMatrixWorld(true);
      o.traverseVisible(m => { if (!m.isMesh || !m.geometry) return; const P = m.geometry.attributes.position;
        for (let k = 0; k < P.count; k++){ v.fromBufferAttribute(P, k).applyMatrix4(m.matrixWorld).project(camera);
          const X = (v.x + 1)/2*VW, Y = (1 - v.y)/2*VH; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); } });
      return [x0, y0, x1, y1]; };
    const a = rectOf(me.object), rc = new THREE.Raycaster(), n2 = new THREE.Vector2(), out = [];
    const others = table.entries.filter(e => e !== me).map(e => [e.id, e.object])
      .concat(table.obstacles.filter(o => o.entry).map(o => ['obs:' + o.entry.id, o.entry.object]));
    for (const [oid, o] of others){
      const b = rectOf(o), ox = Math.min(a[2], b[2]) - Math.max(a[0], b[0]), oy = Math.min(a[3], b[3]) - Math.max(a[1], b[1]);
      const gap = Math.max(-ox, -oy);
      if (gap > 20) continue;
      let both = 0;
      if (ox > 0 && oy > 0) for (let y = Math.max(a[1], b[1]); y <= Math.min(a[3], b[3]); y += 3) for (let x = Math.max(a[0], b[0]); x <= Math.min(a[2], b[2]); x += 3){
        rc.setFromCamera(n2.set(x/VW*2 - 1, 1 - y/VH*2), camera);
        if (rc.intersectObject(me.object, true).some(h => h.object.isMesh) && rc.intersectObject(o, true).some(h => h.object.isMesh)) both++;
      }
      out.push({other: oid, gap: Math.round(gap), both});
    }
    return {rect: a.map(Math.round), near: out};
  },
  /* debug: which pixels (on a step grid) show piece id first, which show
     bare bench round it (40px), and which show each other piece near it */
  propMask(id, step = 2){
    const T = tabletopPhysics, table = T.tables.get(T.activeTableId); if (!table) return null;
    const owner = new Map(); for (const e of table.entries) e.object.traverse(m => owner.set(m, e.id));
    for (const ob of table.obstacles) if (ob.entry) ob.entry.object.traverse(m => owner.set(m, 'obs'));
    for (const r of table.avoid) r.traverse(m => owner.set(m, 'work'));
    const me = table.entries.find(e => e.id === id); if (!me) return null;
    const v = new THREE.Vector3(); let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    me.object.traverseVisible(m => { if (!m.isMesh) return; const P = m.geometry.attributes.position;
      for (let k = 0; k < P.count; k++){ v.fromBufferAttribute(P, k).applyMatrix4(m.matrixWorld).project(camera);
        const X = (v.x + 1)/2*VW, Y = (1 - v.y)/2*VH; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); } });
    const rc = new THREE.Raycaster(), n2 = new THREE.Vector2(), piece = [], bench = [], others = {};
    const shown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
    for (let y = Math.max(0, Math.floor(y0 - 40)); y <= Math.min(VH - 1, y1 + 40); y += step)
      for (let x = Math.max(0, Math.floor(x0 - 40)); x <= Math.min(VW - 1, x1 + 40); x += step){
        rc.setFromCamera(n2.set((x + 0.5)/VW*2 - 1, 1 - (y + 0.5)/VH*2), camera);
        const h = rc.intersectObject(table.group, true).find(q => q.object.isMesh && shown(q.object));
        const o = h ? owner.get(h.object) : undefined;
        if (o === id) piece.push(x, y);
        else if (o === undefined) bench.push(x, y);
        else (others[o] ||= []).push(x, y);
      }
    return {rect: [x0, y0, x1, y1].map(Math.round), piece, bench, others};
  },
  /* debug: the nearest another piece's silhouette comes to this one's on
     screen, in px (2px grid, 40px round it) */
  propGap(id){
    const M = this.propMask(id, 2); if (!M) return null;
    const P = M.piece, out = {};
    for (const [o, Q] of Object.entries(M.others)){
      let d = 1e9;
      for (let i = 0; i < P.length; i += 2) for (let j = 0; j < Q.length; j += 2) d = Math.min(d, Math.hypot(P[i] - Q[j], P[i + 1] - Q[j + 1]));
      out[o] = Math.round(d);
    }
    return {rect: M.rect, gaps: out};
  },
  /* debug: a piece now — screen position, how far it is turned from how it
     lay at load (turn, deg), and its roll's axis off the line of sight (face, deg:
     0 is the spiral end-on, a ring of edges) */
  propPose(id){
    const T = tabletopPhysics, table = T.tables.get(T.activeTableId); if (!table) return null;
    const e = table.entries.find(x => x.id === id); if (!e) return null;
    const q = e.body.quaternion, q0 = e.q0 ||= q.clone();
    const dq = new THREE.Quaternion(q.x, q.y, q.z, q.w).multiply(new THREE.Quaternion(q0.x, q0.y, q0.z, q0.w).invert());
    const w = e.object.getWorldPosition(new THREE.Vector3()), ax = new THREE.Vector3(0, 0, 1).applyQuaternion(e.object.getWorldQuaternion(new THREE.Quaternion()));
    const view = w.clone().sub(camera.position).normalize(), sp = w.clone().project(camera);
    return {sx: Math.round((sp.x + 1)/2*VW), sy: Math.round((1 - sp.y)/2*VH), y: +e.body.position.y.toFixed(3),
      turn: +(2*Math.acos(Math.min(1, Math.abs(dq.w)))*180/Math.PI).toFixed(1), face: +(Math.acos(Math.min(1, Math.abs(ax.dot(view))))*180/Math.PI).toFixed(1)};
  },
  /* debug: how far each loose piece's lowest point sits above what it
     rests on (mm; negative is into it) */
  propContact(){
    const T = tabletopPhysics, table = T.tables.get(T.activeTableId); if (!table) return null;
    const inv = new THREE.Matrix4().copy(table.group.matrixWorld).invert(), v = new THREE.Vector3(), out = [];
    for (const e of table.entries){
      let lo = Infinity, lx = 0, lz = 0;
      e.object.updateMatrixWorld(true);
      e.object.traverseVisible(m => { if (!m.isMesh) return; const P = m.geometry.attributes.position;
        for (let k = 0; k < P.count; k++){ v.fromBufferAttribute(P, k).applyMatrix4(m.matrixWorld).applyMatrix4(inv); if (v.y < lo){ lo = v.y; lx = v.x; lz = v.z; } } });
      let top = table.height;
      for (const o of table.obstacles) if (o.support){ const a = o.body.aabb;
        if (lx >= a.lowerBound.x && lx <= a.upperBound.x && lz >= a.lowerBound.z && lz <= a.upperBound.z) top = Math.max(top, o.top); }
      out.push([e.id, e.kind, +((lo - top)*1000).toFixed(2), e.body.sleepState]);
    }
    return out;
  },
  /* debug: every loose piece's screen rect (its vertices) */
  propRects(){
    const T = tabletopPhysics, table = T.tables.get(T.activeTableId); if (!table) return null;
    const v = new THREE.Vector3(), out = {};
    for (const e of table.entries){ let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
      e.object.updateMatrixWorld(true);
      e.object.traverseVisible(m => { if (!m.isMesh) return; const P = m.geometry.attributes.position;
        for (let k = 0; k < P.count; k++){ v.fromBufferAttribute(P, k).applyMatrix4(m.matrixWorld).project(camera);
          const X = (v.x + 1)/2*VW, Y = (1 - v.y)/2*VH; x0 = Math.min(x0, X); x1 = Math.max(x1, X); y0 = Math.min(y0, Y); y1 = Math.max(y1, Y); } });
      out[e.id] = [x0, y0, x1, y1].map(Math.round); }
    return out;
  },
  propOverlapSelfTest(){
    const T = tabletopPhysics, table = T.tables.get(T.activeTableId); if (!table || table.entries.length < 2) return null;
    const A = table.entries[0].object, B = table.entries[1].object, keep = A.position.clone();
    const wb = new THREE.Vector3(); B.getWorldPosition(wb); A.parent.worldToLocal(wb); A.position.copy(wb); A.updateMatrixWorld(true);
    const r = this.propOverlap(); A.position.copy(keep); A.updateMatrixWorld(true); return r;
  },
  lac(){ return {coat: lacCoat.value, on: lacWipe.on.value, k: +lacWipe.k.value.toFixed(3), fill: +lacWipe.fill.value.toFixed(3), dw: +travel(S.sp).dw.toFixed(3)}; },
  lights(){ const L = []; scene.traverse(o => { if (o.isLight) L.push({t:o.type, name:o.name, on:o.visible, I:+o.intensity.toFixed(3),
      p:o.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(2)), dist:o.distance, ang:o.angle, pen:o.penumbra, sh:o.castShadow}); }); return L; },
  pick(x, y, o, d){
    const rc = new THREE.Raycaster();
    if (o) rc.set(new THREE.Vector3(...o), new THREE.Vector3(...d).normalize());
    else rc.setFromCamera(new THREE.Vector2(x/VW*2 - 1, 1 - y/VH*2), camera);
    rc.params.Points.threshold = 0;
    return rc.intersectObjects(scene.children, true).slice(0, 4).map(h => {
      const chain = []; let o = h.object;
      while (o && chain.length < 5){ chain.push((o.name || o.type) + (o.isInstancedMesh ? '[inst]' : '')); o = o.parent; }
      return {d:+h.distance.toFixed(3), p:h.point.toArray().map(v => +v.toFixed(3)), chain:chain.join(' < '),
              geo:h.object.geometry?.type, mat:h.object.material?.type, vis:h.object.visible};
    });
  },
  swayHold(v){ S.swayHold = !!v; },
  layer(name, on){ scene.traverse(o => { if (o.name === name) o.visible = !!on; }); },
  cam(){ return {p:camera.position.toArray().map(v => +v.toFixed(4)), mx:+S.mx.toFixed(3), my:+S.my.toFixed(3), tmy:+S.tmy.toFixed(3)}; },
  state(){ const T = travel(S.sp); return {reveal:+S.reveal.toFixed(3), sp:+S.sp.toFixed(3),
                   i:T.i, dw:+T.dw.toFixed(3), f:+T.f.toFixed(3), foot:+T.foot.toFixed(3),
                   vw:VW, vh:VH, dpr:+DPR.toFixed(3), qual:+QUAL.toFixed(2),
                   fov:+camera.fov.toFixed(1), frozen:S.freeze,
                   tris:sceneStats.triangles, calls:sceneStats.calls}; }
};
